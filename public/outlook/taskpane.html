<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://appsforoffice.microsoft.com; script-src 'self' https://appsforoffice.microsoft.com; style-src 'self' 'unsafe-inline'; frame-src 'self'; img-src 'self' data: blob:" />
    <title>VeilVia messaging for Outlook</title>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #0b0f14;
        --surface: #131923;
        --surface-secondary: #19212c;
        --border: #252d38;
        --text: #f1f4f7;
        --text-secondary: #a3adb8;
        --text-tertiary: #697583;
        --route: #465d73;
        --signal-violet: #7767d8;
        --verified: #4fa98c;
        --critical: #d05d67;
        --bg: var(--canvas);
        --line: var(--border);
        --muted: var(--text-secondary);
        --err: var(--critical);
      }
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #bar { padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
      #msg { margin: 0; color: var(--muted); }
      #msg.err { color: var(--err); }
      #app { flex: 1; width: 100%; border: 0; min-height: 360px; background: var(--bg); }
      :focus-visible { outline: 2px solid var(--signal-violet); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="bar"><p id="msg" role="status">Looking for a secret in this email…</p></div>
    <iframe id="app" title="VeilVia messaging"></iframe>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="taskpane.js"></script>
  </body>
</html>
